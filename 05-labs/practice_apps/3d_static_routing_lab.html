<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CCNA Static Routing Lab</title>
    
    <!-- Tailwind CSS for UI Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #050505;
            --bg-panel: #111827;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        
        #canvas-container:active {
            cursor: grabbing;
        }

        .device-label {
            position: absolute;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #e2e8f0;
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.9);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .device-label .title {
            font-weight: 800;
            color: #60a5fa;
            font-size: 0.85rem;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            padding-bottom: 2px;
        }

        .device-label .ip-entry {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 3px;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .device-label .intf { color: #94a3b8; }
        .device-label .ip { color: var(--accent-green); font-weight: 700; }

        .cli-input {
            background: #020617;
            border: 1px solid #334155;
            color: #10b981;
            padding: 10px 14px;
            border-radius: 4px;
            width: 100%;
            outline: none;
            transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace;
        }
        .cli-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
        }
        
        .task-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>

<body class="flex flex-col">
    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center z-50 shadow-lg h-16 shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded bg-blue-900/50 border border-blue-500 flex items-center justify-center">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-tight text-white shadow-black drop-shadow-md">NOC ROUTING SIMULATOR</h1>
                <p class="text-[10px] text-gray-400 font-bold tracking-widest uppercase" id="header-level-desc">Level 1: Basic Static Routing</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <select id="level-select" class="bg-gray-800 border border-gray-700 text-white text-sm rounded px-3 py-2 outline-none focus:border-blue-500 font-bold">
                <option value="1">Level 1 (2 Routers)</option>
                <option value="2">Level 2 (3 Routers)</option>
                <option value="3">Level 3 (3 Routers + 3 PCs)</option>
            </select>
            <button id="btn-generate" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded font-bold text-xs shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all uppercase tracking-wider">
                Deploy Topology
            </button>
        </div>
    </header>

    <main class="flex-grow flex w-full h-[calc(100vh-4rem)] overflow-hidden">
        
        <!-- 3D Canvas Area (Left) -->
        <div class="w-2/3 h-full relative bg-[#050505]" id="scene-wrapper">
            <div id="canvas-container"></div>
            <div id="labels-container"></div>
            
            <div class="absolute top-4 left-4 bg-gray-900/90 p-4 rounded border border-gray-700 backdrop-blur-md z-20 pointer-events-none shadow-xl max-w-md">
                <p class="font-black text-blue-400 mb-2 uppercase tracking-widest text-xs"><span class="animate-pulse inline-block w-2 h-2 rounded-full bg-red-500 mr-2"></span>Mission Objective</p>
                <p id="mission-text" class="text-sm text-gray-300 leading-relaxed">
                    Loading mission parameters...
                </p>
            </div>
        </div>

        <!-- CLI / Validation Panel (Right) -->
        <div class="w-1/3 h-full bg-gray-900 border-l border-gray-800 flex flex-col z-20 shadow-[-10px_0_30px_rgba(0,0,0,0.5)]">
            <div class="bg-gray-800/50 p-4 border-b border-gray-800 flex justify-between items-center shrink-0">
                <h2 class="text-sm font-black text-white uppercase tracking-wider">Terminal Input</h2>
                <span class="text-xs text-gray-400">Strict Syntax Required</span>
            </div>
            
            <div class="p-6 flex-grow overflow-y-auto" id="tasks-container">
                <!-- Task Forms will be dynamically injected here -->
            </div>
            
            <!-- Action Button & Feedback -->
            <div class="p-6 border-t border-gray-800 bg-gray-900 shrink-0">
                <button id="btn-check" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded shadow-[0_0_20px_rgba(16,185,129,0.2)] transition-all uppercase tracking-widest text-sm mb-4">
                    Verify Configuration
                </button>
                <div id="feedback-area" class="hidden flex-col gap-2"></div>
            </div>
        </div>
    </main>

    <script>
        // Utility Functions
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        
        function getUniqueOctets(count) {
            let s = new Set();
            while(s.size < count) {
                // Avoid special ranges (0, 127, 224+)
                let val = rand(10, 200);
                if(val !== 127) s.add(val); 
            }
            return Array.from(s);
        }

        // Global State
        let currentLevel = 1;
        let topoData = {};
        let tasks = []; // Array of { router, id, targetName, targetNet, correctMask, correctNextHop }
        
        // References to DOM
        const tasksContainer = document.getElementById('tasks-container');
        const feedbackArea = document.getElementById('feedback-area');
        const missionText = document.getElementById('mission-text');

        function generateNetwork() {
            currentLevel = parseInt(document.getElementById('level-select').value);
            document.getElementById('header-level-desc').innerText = `Level ${currentLevel}: Static Routing`;
            
            // Generate IP blocks
            const o = getUniqueOctets(8); 
            const lans = [ `192.168.${o[0]}.0`, `172.16.${o[1]}.0`, `10.10.${o[2]}.0` ];
            const wans = [ `10.1.${o[3]}.0`, `10.1.${o[4]}.4`, `10.1.${o[5]}.8` ]; // /30 wans

            topoData = { devices: {}, labels: {} };
            tasks = [];

            if (currentLevel === 1) {
                // PC1 -- R1 -- R2 -- PC2
                topoData.devices = {
                    PC1: { name: 'PC-1', ip: lans[0].replace('.0', '.10'), gw: lans[0].replace('.0', '.1') },
                    R1: { name: 'R1', g0: lans[0].replace('.0', '.1'), s0: wans[0].replace('.0', '.1') },
                    R2: { name: 'R2', s0: wans[0].replace('.0', '.2'), g0: lans[1].replace('.0', '.1') },
                    PC2: { name: 'PC-2', ip: lans[1].replace('.0', '.10'), gw: lans[1].replace('.0', '.1') }
                };
                
                missionText.innerHTML = `Configure <span class="text-white font-bold mono">R1</span> with a static route to reach <span class="text-emerald-400 font-bold mono">PC-2's Network (${lans[1]}/24)</span>.`;

                tasks.push({
                    id: 'r1-task',
                    router: 'R1',
                    targetName: "PC-2's Network",
                    correctNet: lans[1],
                    correctMask: '255.255.255.0',
                    correctNextHop: wans[0].replace('.0', '.2') // R2's S0
                });
            } 
            else if (currentLevel === 2) {
                // PC1 -- R1 -- R2 -- R3 -- PC2
                topoData.devices = {
                    PC1: { name: 'PC-1', ip: lans[0].replace('.0', '.10'), gw: lans[0].replace('.0', '.1') },
                    R1: { name: 'R1', g0: lans[0].replace('.0', '.1'), s0: wans[0].replace('.0', '.1') },
                    R2: { name: 'R2', s0: wans[0].replace('.0', '.2'), s1: wans[1].replace('.4', '.5') },
                    R3: { name: 'R3', s0: wans[1].replace('.4', '.6'), g0: lans[1].replace('.0', '.1') },
                    PC2: { name: 'PC-2', ip: lans[1].replace('.0', '.10'), gw: lans[1].replace('.0', '.1') }
                };

                missionText.innerHTML = `Establish full connectivity. <br>1. Configure <span class="text-white font-bold mono">R1</span> to reach <span class="text-emerald-400 font-bold mono">PC-2's Network</span>.<br>2. Configure <span class="text-white font-bold mono">R3</span> to reach <span class="text-emerald-400 font-bold mono">PC-1's Network</span>.`;

                tasks.push({
                    id: 'r1-task', router: 'R1', targetName: "PC-2's Network",
                    correctNet: lans[1], correctMask: '255.255.255.0',
                    correctNextHop: wans[0].replace('.0', '.2') // Next hop is R2
                });
                tasks.push({
                    id: 'r3-task', router: 'R3', targetName: "PC-1's Network",
                    correctNet: lans[0], correctMask: '255.255.255.0',
                    correctNextHop: wans[1].replace('.4', '.5') // Next hop is R2
                });
            }
            else if (currentLevel === 3) {
                // PC1 -- R1 -- R2(PC2) -- R3(PC3)
                topoData.devices = {
                    PC1: { name: 'PC-1', ip: lans[0].replace('.0', '.10'), gw: lans[0].replace('.0', '.1') },
                    R1: { name: 'R1', g0: lans[0].replace('.0', '.1'), s0: wans[0].replace('.0', '.1') },
                    R2: { name: 'R2', s0: wans[0].replace('.0', '.2'), g0: lans[1].replace('.0', '.1'), s1: wans[1].replace('.4', '.5') },
                    PC2: { name: 'PC-2', ip: lans[1].replace('.0', '.10'), gw: lans[1].replace('.0', '.1') },
                    R3: { name: 'R3', s0: wans[1].replace('.4', '.6'), g0: lans[2].replace('.0', '.1') },
                    PC3: { name: 'PC-3', ip: lans[2].replace('.0', '.10'), gw: lans[2].replace('.0', '.1') }
                };

                missionText.innerHTML = `Configure <span class="text-white font-bold mono">R1</span> with static routes to reach <span class="text-emerald-400 font-bold mono">PC-2's Network</span> AND <span class="text-emerald-400 font-bold mono">PC-3's Network</span>. (Notice the next-hop strategy).`;

                tasks.push({
                    id: 'r1-task1', router: 'R1', targetName: "PC-2's Network",
                    correctNet: lans[1], correctMask: '255.255.255.0',
                    correctNextHop: wans[0].replace('.0', '.2') // Next hop is R2
                });
                tasks.push({
                    id: 'r1-task2', router: 'R1', targetName: "PC-3's Network",
                    correctNet: lans[2], correctMask: '255.255.255.0',
                    correctNextHop: wans[0].replace('.0', '.2') // Next hop is STILL R2!
                });
            }

            buildUIForms();
            build3DScene();
        }

        function buildUIForms() {
            tasksContainer.innerHTML = '';
            feedbackArea.classList.add('hidden');
            feedbackArea.innerHTML = '';

            tasks.forEach(t => {
                const html = `
                <div class="task-card">
                    <div class="text-sm font-bold text-blue-400 mb-4 uppercase tracking-wide border-b border-gray-700 pb-2">
                        Task: Route to ${t.targetName}
                    </div>
                    <div class="flex items-center text-gray-300 mb-4 gap-2 text-sm mono">
                        <span class="font-bold text-emerald-400">${t.router}(config)#</span>
                        <span class="text-white">ip route</span>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[11px] uppercase tracking-widest text-gray-500 mb-1 font-bold">Dest Network (e.g., X.X.X.0)</label>
                            <input type="text" id="${t.id}-net" class="cli-input" placeholder="0.0.0.0" autocomplete="off">
                        </div>
                        <div>
                            <label class="block text-[11px] uppercase tracking-widest text-gray-500 mb-1 font-bold">Subnet Mask (e.g., 255.X.X.X)</label>
                            <input type="text" id="${t.id}-mask" class="cli-input" placeholder="0.0.0.0" autocomplete="off">
                        </div>
                        <div>
                            <label class="block text-[11px] uppercase tracking-widest text-gray-500 mb-1 font-bold">Next-Hop IP Address</label>
                            <input type="text" id="${t.id}-next" class="cli-input" placeholder="0.0.0.0" autocomplete="off">
                        </div>
                    </div>
                </div>`;
                tasksContainer.innerHTML += html;
            });
        }

        document.getElementById('btn-check').addEventListener('click', () => {
            feedbackArea.innerHTML = '';
            feedbackArea.classList.remove('hidden');
            let allCorrect = true;

            tasks.forEach(t => {
                const inNet = document.getElementById(`${t.id}-net`).value.trim();
                const inMask = document.getElementById(`${t.id}-mask`).value.trim();
                const inNext = document.getElementById(`${t.id}-next`).value.trim();

                const netOk = (inNet === t.correctNet);
                const maskOk = (inMask === t.correctMask);
                const nextOk = (inNext === t.correctNextHop);

                // Update UI Borders
                document.getElementById(`${t.id}-net`).style.borderColor = netOk ? 'var(--accent-green)' : 'var(--accent-red)';
                document.getElementById(`${t.id}-mask`).style.borderColor = maskOk ? 'var(--accent-green)' : 'var(--accent-red)';
                document.getElementById(`${t.id}-next`).style.borderColor = nextOk ? 'var(--accent-green)' : 'var(--accent-red)';

                if (!netOk || !maskOk || !nextOk) {
                    allCorrect = false;
                    let errs = [];
                    if (!netOk) errs.push(`Destination Network for ${t.targetName} is incorrect.`);
                    if (!maskOk) errs.push(`Subnet Mask is incorrect (Check if it's a /24 LAN).`);
                    if (!nextOk) errs.push(`Next-Hop IP is incorrect. Must be the directly connected neighbor's IP.`);
                    
                    feedbackArea.innerHTML += `
                        <div class="bg-red-900/20 border border-red-800 p-3 rounded text-sm mb-2">
                            <strong class="text-red-400 block mb-1">${t.router} Configuration Error:</strong>
                            ${errs.map(e => `<p class="text-red-200">- ${e}</p>`).join('')}
                        </div>
                    `;
                }
            });

            if (allCorrect) {
                feedbackArea.innerHTML = `
                    <div class="bg-emerald-900/20 border border-emerald-800 p-4 rounded text-center">
                        <div class="text-lg font-black text-emerald-400 mb-1 uppercase tracking-widest">Success!</div>
                        <p class="text-emerald-100/80 text-sm">All static routes are correctly configured. End-to-end connectivity established.</p>
                    </div>
                `;
            }
        });

        document.getElementById('btn-generate').addEventListener('click', generateNetwork);

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.015);

        const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x202530, 1.5);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0x60a5fa, 3);
        spotLight.position.set(0, 50, 30);
        spotLight.angle = Math.PI / 4;
        spotLight.penumbra = 0.5;
        spotLight.castShadow = true;
        scene.add(spotLight);
        
        const gridHelper = new THREE.GridHelper(150, 75, 0x1e293b, 0x0f172a);
        gridHelper.position.y = -2.5;
        scene.add(gridHelper);

        // Materials cache
        const mats = {
            chassis: new THREE.MeshStandardMaterial({ color: 0x1a1c20, metalness: 0.7, roughness: 0.4 }),
            silver: new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.2 }),
            dark: new THREE.MeshStandardMaterial({ color: 0x0a0a0c, metalness: 0.3, roughness: 0.8 }),
            port: new THREE.MeshStandardMaterial({ color: 0xb8860b, metalness: 0.5, roughness: 0.5 }), // Goldish
            screen: new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x0ea5e9, emissiveIntensity: 0.3 })
        };

        let sceneObjects = [];
        let trackedLabels = [];
        let blinkLEDs = [];

        function createRouter(x, z, labelId, labelData) {
            const group = new THREE.Group();
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(6, 1.2, 4), mats.chassis);
            body.castShadow = true; body.receiveShadow = true;
            group.add(body);

            const front = new THREE.Mesh(new THREE.BoxGeometry(5.8, 1, 0.1), mats.dark);
            front.position.set(0, 0, 2.01);
            group.add(front);

            const earGeo = new THREE.BoxGeometry(0.4, 1.2, 0.6);
            const earL = new THREE.Mesh(earGeo, mats.silver); earL.position.set(-3.2, 0, 1.7); group.add(earL);
            const earR = new THREE.Mesh(earGeo, mats.silver); earR.position.set(3.2, 0, 1.7); group.add(earR);

            // Ports and LEDs
            for(let i=0; i<4; i++) {
                const port = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.2), mats.port);
                port.position.set(-2 + (i*1.3), 0, 2.1);
                group.add(port);
                
                const ledMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x10b981, emissiveIntensity: 1 });
                const led = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), ledMat);
                led.position.set(-2 + (i*1.3), 0.4, 2.1);
                group.add(led);
                blinkLEDs.push(led);
            }

            group.position.set(x, 0, z);
            scene.add(group);
            sceneObjects.push(group);
            
            addHTMLTracker(group, labelId, labelData, 3.5);
            return group;
        }

        function createPC(x, z, labelId, labelData) {
            const group = new THREE.Group();

            const tower = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3.5, 3), mats.chassis);
            tower.position.set(2, 0.5, 0); tower.castShadow = true;
            group.add(tower);

            const base = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1.5), mats.silver);
            base.position.set(-0.5, -1.2, 0); group.add(base);

            const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5), mats.silver);
            neck.position.set(-0.5, -0.6, 0); group.add(neck);

            const screen = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2.5, 0.2), mats.chassis);
            screen.position.set(-0.5, 0.8, 0.1); group.add(screen);

            const display = new THREE.Mesh(new THREE.PlaneGeometry(3.3, 2.3), mats.screen);
            display.position.set(-0.5, 0.8, 0.21); group.add(display);

            group.position.set(x, 0, z);
            scene.add(group);
            sceneObjects.push(group);
            
            addHTMLTracker(group, labelId, labelData, 4.5);
            return group;
        }

        function createCable(pos1, pos2, colorHex) {
            const material = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 2 });
            const points = [
                new THREE.Vector3(pos1.x, 0, pos1.z),
                new THREE.Vector3(pos1.x, -2.4, pos1.z),
                new THREE.Vector3(pos2.x, -2.4, pos2.z),
                new THREE.Vector3(pos2.x, 0, pos2.z)
            ];
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material);
            scene.add(line);
            sceneObjects.push(line);
        }

        function addHTMLTracker(obj, id, data, yOffset) {
            trackedLabels.push({ obj, id, data, yOffset });
        }

        function renderLabelsDOM() {
            const container = document.getElementById('labels-container');
            container.innerHTML = '';
            
            trackedLabels.forEach(t => {
                let html = `<div class="device-label" id="lbl-${t.id}">`;
                html += `<div class="title">${t.data.name}</div>`;
                t.data.ints.forEach(i => {
                    html += `<div class="ip-entry"><span class="intf">${i.name}</span><span class="ip">${i.ip}</span></div>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            });
        }

        function build3DScene() {
            // Cleanup old scene
            sceneObjects.forEach(obj => scene.remove(obj));
            sceneObjects = [];
            trackedLabels = [];
            blinkLEDs = [];
            document.getElementById('labels-container').innerHTML = '';

            const d = topoData.devices;

            if (currentLevel === 1) {
                camera.position.set(0, 35, 45); // Closer zoom
                const pc1 = createPC(-20, 0, 'PC1', { name: d.PC1.name, ints: [{name: 'Eth0', ip: d.PC1.ip}, {name: 'GW', ip: d.PC1.gw}] });
                const r1 = createRouter(-8, 0, 'R1', { name: d.R1.name, ints: [{name: 'G0/0', ip: d.R1.g0}, {name: 'S0/0/0', ip: d.R1.s0}] });
                const r2 = createRouter(8, 0, 'R2', { name: d.R2.name, ints: [{name: 'S0/0/0', ip: d.R2.s0}, {name: 'G0/0', ip: d.R2.g0}] });
                const pc2 = createPC(20, 0, 'PC2', { name: d.PC2.name, ints: [{name: 'Eth0', ip: d.PC2.ip}, {name: 'GW', ip: d.PC2.gw}] });

                createCable(pc1.position, r1.position, 0x3b82f6); // LAN blue
                createCable(r1.position, r2.position, 0xef4444);  // WAN red
                createCable(r2.position, pc2.position, 0x3b82f6); // LAN blue
            }
            else if (currentLevel === 2) {
                camera.position.set(0, 45, 55);
                const pc1 = createPC(-25, 10, 'PC1', { name: d.PC1.name, ints: [{name: 'Eth0', ip: d.PC1.ip}, {name: 'GW', ip: d.PC1.gw}] });
                const r1 = createRouter(-12, 0, 'R1', { name: d.R1.name, ints: [{name: 'G0/0', ip: d.R1.g0}, {name: 'S0/0/0', ip: d.R1.s0}] });
                const r2 = createRouter(0, -10, 'R2', { name: d.R2.name, ints: [{name: 'S0/0/0', ip: d.R2.s0}, {name: 'S0/0/1', ip: d.R2.s1}] });
                const r3 = createRouter(12, 0, 'R3', { name: d.R3.name, ints: [{name: 'S0/0/0', ip: d.R3.s0}, {name: 'G0/0', ip: d.R3.g0}] });
                const pc2 = createPC(25, 10, 'PC2', { name: d.PC2.name, ints: [{name: 'Eth0', ip: d.PC2.ip}, {name: 'GW', ip: d.PC2.gw}] });

                createCable(pc1.position, r1.position, 0x3b82f6);
                createCable(r1.position, r2.position, 0xef4444);
                createCable(r2.position, r3.position, 0xef4444);
                createCable(r3.position, pc2.position, 0x3b82f6);
            }
            else if (currentLevel === 3) {
                camera.position.set(0, 55, 60);
                const pc1 = createPC(-25, 0, 'PC1', { name: d.PC1.name, ints: [{name: 'Eth0', ip: d.PC1.ip}, {name: 'GW', ip: d.PC1.gw}] });
                const r1 = createRouter(-12, -10, 'R1', { name: d.R1.name, ints: [{name: 'G0/0', ip: d.R1.g0}, {name: 'S0/0/0', ip: d.R1.s0}] });
                const r2 = createRouter(0, 0, 'R2', { name: d.R2.name, ints: [{name: 'S0/0/0', ip: d.R2.s0}, {name: 'S0/0/1', ip: d.R2.s1}, {name: 'G0/0', ip: d.R2.g0}] });
                const pc2 = createPC(0, 15, 'PC2', { name: d.PC2.name, ints: [{name: 'Eth0', ip: d.PC2.ip}, {name: 'GW', ip: d.PC2.gw}] });
                const r3 = createRouter(12, -10, 'R3', { name: d.R3.name, ints: [{name: 'S0/0/0', ip: d.R3.s0}, {name: 'G0/0', ip: d.R3.g0}] });
                const pc3 = createPC(25, 0, 'PC3', { name: d.PC3.name, ints: [{name: 'Eth0', ip: d.PC3.ip}, {name: 'GW', ip: d.PC3.gw}] });

                createCable(pc1.position, r1.position, 0x3b82f6);
                createCable(r1.position, r2.position, 0xef4444);
                createCable(pc2.position, r2.position, 0x3b82f6); // Central PC
                createCable(r2.position, r3.position, 0xef4444);
                createCable(r3.position, pc3.position, 0x3b82f6);
            }

            renderLabelsDOM();
        }

        let isDragging = false, prevMouse = {x:0, y:0}, camAngleX = 0, camAngleY = Math.PI / 4;
        let radius = 60; // default, adjusts via level build visually

        container.addEventListener('mousedown', e => { isDragging = true; prevMouse = {x: e.clientX, y: e.clientY}; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => {
            if(!isDragging) return;
            camAngleX -= (e.clientX - prevMouse.x) * 0.005;
            camAngleY -= (e.clientY - prevMouse.y) * 0.005;
            camAngleY = Math.max(0.1, Math.min(Math.PI/2 - 0.1, camAngleY));
            prevMouse = {x: e.clientX, y: e.clientY};
        });

        // Wheel zoom
        container.addEventListener('wheel', e => {
            radius += e.deltaY * 0.05;
            radius = Math.max(30, Math.min(100, radius));
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            // Orbit Camera
            camera.position.x = radius * Math.sin(camAngleX) * Math.cos(camAngleY);
            camera.position.y = radius * Math.sin(camAngleY);
            camera.position.z = radius * Math.cos(camAngleX) * Math.cos(camAngleY);
            camera.lookAt(0, 0, 0);

            // Blink LEDs
            const time = clock.getElapsedTime();
            blinkLEDs.forEach((led, i) => {
                led.material.emissiveIntensity = Math.sin(time * 12 + i) > 0 ? 1 : 0.1;
            });

            renderer.render(scene, camera);

            // Project 3D labels to 2D UI
            const hw = container.clientWidth / 2;
            const hh = container.clientHeight / 2;
            
            trackedLabels.forEach(t => {
                const el = document.getElementById(`lbl-${t.id}`);
                if (!el) return;

                const pos = new THREE.Vector3();
                t.obj.getWorldPosition(pos);
                pos.y += t.yOffset;
                pos.project(camera);

                if (pos.z > 1) {
                    el.style.display = 'none';
                } else {
                    el.style.display = 'block';
                    el.style.left = `${(pos.x * hw) + hw}px`;
                    el.style.top = `${-(pos.y * hh) + hh}px`;
                }
            });
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Initialize App
        window.onload = () => {
            generateNetwork();
            animate();
        };
    </script>
</body>
</html>
